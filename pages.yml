name: نشر المنصة

# ينشر المنصة عند تعديل ملفاتها يدوياً (تحديثات البيانات تنشر نفسها من ملف التحديث)
on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "inbox/**"]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
